<!DOCTYPE html>
<html>
<head>
    <title>Simple Banking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
        }

        .header {
            background: #0b1220;
            padding: 16px clamp(14px, 2vw, 20px);
            font-size: clamp(15px, 1.3vw, 18px);
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #1f2937;
        }

        .container {
            /* Was: max-width: 900px (only ~51% of a 1776px viewport - this
               was the confirmed cause of the Banking Control Panel looking
               like a tiny centered box). Now uses the same 88vw / 1600px
               cap as the SOC dashboard, landing at 83-88% of the viewport
               across 1366/1776/1920. */
            width: 88vw;
            max-width: 1600px;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 32px) 0;
        }

        @media (max-width: 700px) {
            .container {
                width: 94vw;
            }
        }

        h1 {
            margin-bottom: 20px;
            font-size: clamp(18px, 1.8vw, 22px);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            /* Fills the container (which is already capped at 1600px by
               .container above) instead of an extra, tighter 800px cap. */
        }

        @media (max-width: 640px) {
            .btn-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 380px) {
            .btn-grid {
                grid-template-columns: 1fr;
            }
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: clamp(13px, 1vw, 14px);
            font-weight: bold;
            transition: 0.2s;
            color: white;
            min-width: 0;
        }

        button:hover {
            transform: scale(1.05);
        }

        .login { background: #22c55e; }
        .search { background: #38bdf8; }
        .profile { background: #a78bfa; }
        .admin { background: #f59e0b; }
        .delete { background: #ef4444; }
        .transfer { background: #f97316; }

        .output {
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            padding: clamp(12px, 1.5vw, 15px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            min-height: 120px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="header">
    🏦 Banking Control Panel
</div>

<div class="container">

    <h1>Simple Banking System</h1>

    <div class="btn-grid">
        <button class="login" onclick="callAPI('/login')">Login</button>
        <button class="search" onclick="callAPI('/search')">Search</button>
        <button class="profile" onclick="callAPI('/profile')">Profile</button>
        <button class="admin" onclick="callAPI('/admin/dashboard')">Admin</button>
        <button class="delete" onclick="callAPI('/admin/delete-user')">Delete User</button>
        <button class="transfer" onclick="callAPI('/payment/transfer')">Transfer Money</button>
    </div>

    <div id="output" class="output">Response will appear here...</div>

</div>

<script>
async function callAPI(endpoint) {
    let res = await fetch(endpoint);
    let data = await res.json();

    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
